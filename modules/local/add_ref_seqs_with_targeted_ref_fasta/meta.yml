name: add_ref_seqs_with_targeted_ref_fasta
description: Add reference sequences to a panel BED using a targeted/reference FASTA
keywords:
  - reference
  - bed
  - fasta
  - biostrings
tools:
  - add_ref_seqs_with_targeted_ref_fasta:
      description: |
        PGEcore R script that matches target IDs to sequences in a targeted FASTA.
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://plasmogenepi.github.io/PGEcore/reference/add_ref_seqs_with_targeted_ref_fasta.html
      licence: ["MIT"]
input:
  - ref_bed:
      type: file
      description: Panel BED without sequences
      pattern: "*"
  - fasta:
      type: file
      description: Targeted reference FASTA
      pattern: "*"
output:
  - ref_bed_with_seqs:
      - ref_bed_with_seqs.bed:
          type: file
          description: BED with reference sequence column
          pattern: ref_bed_with_seqs.bed
  - versions:
      - versions.yml:
          type: file
          description: Software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/add_ref_seqs_biostrings:18ac1e5b6fdf043b
      build_id: bd-18ac1e5b6fdf043b_1
      scan_id: sc-18a0d5ea3a65858b_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/add_ref_seqs_biostrings:6416162e38208eec

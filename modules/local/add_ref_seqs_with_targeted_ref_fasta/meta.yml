name: add_ref_seqs_with_targeted_ref_fasta
description: Add reference sequences to a panel BED using a targeted/reference FASTA
keywords:
  - reference
  - bed
  - fasta
  - biostrings
tools:
  - add_ref_seqs_with_targeted_ref_fasta:
      description: |
        PGEcore R script that matches target IDs to sequences in a targeted FASTA.
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://github.com/PlasmoGenEpi/PGEcore/tree/develop/scripts/add_ref_seq_to_ref_bed_table
      licence: ["MIT"]
input:
  - ref_bed:
      type: file
      description: Panel BED without sequences
      pattern: "*"
  - fasta:
      type: file
      description: Targeted reference FASTA
      pattern: "*"
output:
  - ref_bed_with_seqs:
      - ref_bed_with_seqs.bed:
          type: file
          description: BED with reference sequence column
          pattern: ref_bed_with_seqs.bed
  - versions:
      - versions.yml:
          type: file
          description: Software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/bioc_biostrings:859138378410587f
      build_id: bd-859138378410587f_1
      scan_id: sc-d48407561ad6c251_1
  singularity:

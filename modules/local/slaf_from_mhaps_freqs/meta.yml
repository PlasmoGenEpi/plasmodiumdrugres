name: slaf_from_mhaps_freqs
description: Derive single-locus allele frequencies from microhaplotype frequency tables
keywords:
  - slaf
  - microhaplotype
  - mhaps
tools:
  - slaf_from_mhaps_freqs:
      description: |
        PGEcore R script that expands microhap frequencies to single-locus frequencies.
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://plasmogenepi.github.io/PGEcore/reference/slaf_from_mhaps_freqs.html
      licence: ["MIT"]
input:
  - group_name:
      type: string
      description: Population or analysis group label
  - mhaps_slaf_fnp:
      type: file
      description: Microhaplotype single-locus allele frequency table (TSV)
      pattern: "*"
  - loci_of_interest_per_microhaps_fnp:
      type: file
      description: Mapping of loci of interest to covering microhaplotypes (TSV)
      pattern: "*"
output:
  - slaf:
      - "${group_name}.slaf.tsv":
          type: file
          description: Derived single-locus allele frequency table
          pattern: "${group_name}.slaf.tsv"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/r-pgecore:2b87bb570d668c51
      build_id: bd-2b87bb570d668c51_1
      scan_id: sc-4360f69cddbceb2a_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/r-pgecore:d399f1232d16439d
      build_id: bd-d399f1232d16439d_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/71/71e5209ab05c23f35342479478217ecb098fba221344a8b3a36654d215bf0cbd/data
  conda:
    linux/amd64:

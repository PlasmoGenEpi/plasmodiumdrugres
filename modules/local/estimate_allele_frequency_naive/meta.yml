name: estimate_allele_frequency_naive
description: Naive single-locus allele frequency estimation
keywords:
  - allele frequency
  - naive
  - slaf
tools:
  - estimate_allele_frequency_naive:
      description: |
        PGEcore R script for naive SLAF (read_count_prop or presence_absence).
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://plasmogenepi.github.io/PGEcore/reference/estimate_allele_frequency_naive.html
      licence: ["MIT"]
input:
  - aa_calls:
      type: file
      description: Amino acid or allele call table (TSV)
      pattern: "*"
  - method:
      type: string
      description: Estimation method (e.g. read_count_prop or presence_absence)
output:
  - slaf:
      - "${aa_calls.getBaseName(3)}.aa_slaf.tsv":
          type: file
          description: Naive single-locus allele frequency table
          pattern: "${aa_calls.getBaseName(3)}.aa_slaf.tsv"
  - versions:
      - versions.yml:
          type: file
          description: Software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/r-pgecore:2b87bb570d668c51
      build_id: bd-2b87bb570d668c51_1
      scan_id: sc-4360f69cddbceb2a_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/r-pgecore:d399f1232d16439d

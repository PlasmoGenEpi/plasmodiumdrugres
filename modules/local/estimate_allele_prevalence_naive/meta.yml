name: estimate_allele_prevalence_naive
description: Naive allele prevalence estimation
keywords:
  - prevalence
  - naive
  - allele
tools:
  - estimate_allele_prevalence_naive:
      description: |
        PGEcore R script for naive allele prevalence from amino acid calls.
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://plasmogenepi.github.io/PGEcore/reference/estimate_allele_prevalence_naive.html
      licence: ["MIT"]
input:
  - aa_calls:
      type: file
      description: Amino acid call table (TSV)
      pattern: "*"
output:
  - allele_prevalence:
      - "${aa_calls.getBaseName(3)}.allele_prev.tsv":
          type: file
          description: Naive allele prevalence table
          pattern: "${aa_calls.getBaseName(3)}.allele_prev.tsv"
  - versions:
      - versions.yml:
          type: file
          description: Software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/r-pgecore:2b87bb570d668c51
      build_id: bd-2b87bb570d668c51_1
      scan_id: sc-4360f69cddbceb2a_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/r-pgecore:d399f1232d16439d
      build_id: bd-d399f1232d16439d_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/71/71e5209ab05c23f35342479478217ecb098fba221344a8b3a36654d215bf0cbd/data
